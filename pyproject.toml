[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-accounts"
version = "0.1.0"
description = "Bank account management laboratory project"
requires-python = ">=3.11"

[project.scripts]
bank-accounts = "bank_accounts.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
